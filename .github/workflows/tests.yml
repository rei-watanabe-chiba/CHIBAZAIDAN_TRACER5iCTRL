# push のたびに、機器なしで走らせられるテストを Windows で走らせる
# (偽の機器・偽の蓋のセンサー・一時フォルダだけを使う。web_smoke_test は WebView2 の窓を出すので入れない)
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: パッケージを入れる
        run: python -m pip install -r requirements.txt
      - name: core_test
        run: python tests/core_test.py
      - name: measure_logic_test
        run: python tests/measure_logic_test.py
      - name: controller_test
        run: python tests/controller_test.py
